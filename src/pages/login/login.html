<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/pages/login/login.css">
    
    <title>Organize&Compre</title>
</head>
<body>
<header class="header-login">
    <div>
        <h1 class="title">Login</h1>
        <p class="text-subtitle">Sua lista de compras inteligente começa
        aqui. Por favor faça o login!</p>
    </div>
</header>
<main class="main-login">
    <form class="section-input" id="login-form">
        <div class="user-input">
            <label class="label" for="login-email">E-MAIL</label>
            <input type="email" id="login-email" class="input-nome" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        
        <div class="password">
            <label class="label" for="text-password">SENHA</label>
            <div class="pass-input">
                <input type="password" id="text-password" class="input-password" placeholder="Sua senha aqui..." autocomplete="current-password" required>
                    <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
                        <i class="ri-eye-line" aria-hidden="true"></i>
                    </button>
                </div>
        <button type="button" id="esqueci-senha" class="btn-esqueci">Esqueci minha senha</button>
        </div>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        <button type="submit" id="btn-entrar" class="btn-entrar">Entrar</button>
    </form>

    <section class="signup-section">
        <p class="conect-text">Login social ainda não está disponível.</p>
        <div class="cadastre-section">
            <p class="text-cadastre">Novo por aqui?</p>
            <a href="/src/pages/cadastro/cadastro.html" class="cadastre">Cadastre-se</a>
        </div>
    </section>
</main>
<footer class="footer-login">
    <p class="text-footer">© 2026 Organize&Compre. Todos os direitos reservados.</p>
</footer>


    <script src="/src/pages/login/login.js" type="module"></script>
</body>
</html>
