<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/pages/cadastro/cadastro.css">
    <title>Organize&Compre</title>
</head>
<body>
    <header class="header-conta">
        <h1 class="title">Criar Conta</h1>
    </header>
    <main class="main-conta">
        <form class="section-text" id="register-form">
            <div class="nome-sobrenome">
                <div class="nome">
                    <label for="text-nome" class="label">NOME</label>
                    <input type="text" id="text-nome" class="input-nome" placeholder="Ex: João" required>
                </div>
                <div class="sobrenome">
                    <label for="text-sobrenome" class="label">SOBRENOME</label>
                    <input type="text" id="text-sobrenome" class="input-sobrenome" placeholder="Ex: Silva" required>
                </div>
            </div>

            <label  for="text-email" class="label">EMAIL</label>
            <input type="email" id = "text-email" class="input-email" placeholder="seu@email.com" required>

            <label  for="password" class="label">SENHA</label>
            <input id="password" type="password" class="input-password" placeholder="Senha (mínimo 12 caracteres)" minlength="12" maxlength="128" autocomplete="new-password" required>
            <label  for="confirm-password" class="label">CONFIRMAR SENHA</label>
            <input id="confirm-password" type="password" class="input-password" placeholder="Confirme sua senha" minlength="12" maxlength="128" autocomplete="new-password" required>
            <button type="button" class="mostrar-senha" id="password-mostrar" aria-pressed="false">Mostrar senhas</button>
            <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            
            <button type="submit" id="btn-cadastro" class="btn-cadastro">Cadastrar</button>
        </form>
        <section class="signup-section">
            <p class="conect-text">Login social ainda não está disponível.</p>
            <div class="cadastre-section">
                <p class="text-cadastre">Ja tem uma conta?</p>
                <a href="/src/pages/login/login.html" class="cadastre">Entrar</a>
            </div>
        </section>
    </main>
    <footer class="footer-conta">
        <p class="text-footer">© 2026 Organize&Compre. Todos os direitos reservados.</p>
    </footer>
    
    
    <script type="module" src="/src/pages/cadastro/cadastro.js"></script>
</body>
</html>
